name: Cloudflare D1 API (isolated checks)

on:
  pull_request:
    paths:
      - 'services/cloudflare-api/**'
      - '.github/workflows/cloudflare-api-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloudflare-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      # A locked deterministic install must replace this initial bootstrap step
      # when services/cloudflare-api/package-lock.json is generated and reviewed.
      - name: Install isolated Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Test query validation and cursors
        run: npm test
      - name: Verify D1 migration using isolated in-memory SQLite
        run: python3 scripts/verify_schema.py

      # Temporary: make npm's resolved dependency graph reviewable,
      # without granting GitHub Actions write access to the repository.
      - name: Emit generated npm lockfile for offline review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = Path('package-lock.json').read_text(encoding='utf-8')
          for i in range(0, len(lock), 4000):
              print(f'LOCKFILE_CHUNK:{i}:' + json.dumps(lock[i:i+4000], ensure_ascii=True))
          print(f'LOCKFILE_LENGTH:{len(lock)}')
          PY

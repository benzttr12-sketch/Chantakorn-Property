name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-health.mjs'
      - 'tests/production-health.test.cjs'
      - '.github/workflows/production-health.yml'

permissions:
  contents: read

concurrency:
  group: production-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monitor against synthetic failures
        run: node --test tests/production-health.test.cjs

  live-health:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: monitor-contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public production and unauthenticated access boundaries
        run: node scripts/production-health.mjs
        env:
          HEALTH_REPORT_PATH: production-health.json
      - name: Retain redacted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          retention-days: 7
          if-no-files-found: ignore
